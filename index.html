<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>どろんこ 活動カレンダー（完全版プレビュー）</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const gradeColors = {
      "1年": "border-lime-500 text-lime-600 bg-lime-50 ring-lime-500/10",
      "2年": "border-amber-400 text-amber-600 bg-amber-50 ring-amber-400/10",
      "3年": "border-fuchsia-400 text-fuchsia-600 bg-fuchsia-50 ring-fuchsia-500/10",
      "4年": "border-pink-400 text-pink-600 bg-pink-50 ring-pink-500/10",
    };

    const locationsList = [
      "ありんこ", "一ノ宮", "押立", "片町", "上田", 
      "是政", "桜まつり", "新町", "神明", "白糸", 
      "多摩境", "南平", "紅葉", "由木", "四谷"
    ];

    const initialEvents = {
      "2026-11-15": { 
        id: 1, title: "神明あそび相手ボランティア", location: "神明", color: "bg-pink-100 text-pink-700 border-pink-200", limit: 12, 
        startTime: "13:00", endTime: "16:00", items: "上履き、動きやすい服装", description: "子どもたちと一緒に外遊びやレクを行います！", 
        attendees: [{ name: "どろね", grade: "3年" }], lineGroupUrl: "https://line.me/example" 
      },
      "2026-11-18": { 
        id: 2, title: "白糸お芋掘り補助", location: "白糸", color: "bg-emerald-100 text-emerald-700 border-emerald-200", limit: 6, 
        startTime: "10:00", endTime: "12:00", items: "軍手、汚れてもいい服", description: "園児たちのお芋掘りのお手伝いです。", 
        attendees: [], lineGroupUrl: "" 
      },
      "2026-11-21": { 
        id: 3, title: "南平シニアお話し相手", location: "南平", color: "bg-amber-100 text-amber-700 border-amber-200", limit: 8, 
        startTime: "14:00", endTime: "17:00", items: "特になし", description: "お話し相手や簡単なレクリエーションを行います。", 
        attendees: [{ name: "みく", grade: "2年" }], lineGroupUrl: "" 
      },
    };

    function App() {
      const [events, setEvents] = useState(initialEvents);
      const [selectedDate, setSelectedDate] = useState("2026-11-15");
      const [currentView, setCurrentView] = useState("calendar");
      const detailSectionRef = useRef(null);

      // プロフィール・参加用State (localStorage風)
      const [myName, setMyName] = useState("どろね");
      const [myGrade, setMyGrade] = useState("3年");
      const [isNameSaved, setIsNameSaved] = useState(true);

      // 館付認証State
      const [isAdmin, setIsAdmin] = useState(false);
      const [inputPassword, setInputPassword] = useState("");
      const [adminError, setAdminError] = useState(false);

      // 新規活動登録用State (館付用)
      const [newTitle, setNewTitle] = useState("");
      const [newLocation, setNewLocation] = useState("神明");
      const [newLimit, setNewLimit] = useState(10);
      const [newStartTime, setNewStartTime] = useState("13:00");
      const [newEndTime, setNewEndTime] = useState("16:00");
      const [newItems, setNewItems] = useState("上履き");
      const [newDesc, setNewDesc] = useState("");
      const [newDate, setNewDate] = useState("2026-11-20");

      const handleDateClick = (dateStr) => {
        setSelectedDate(dateStr);
        setTimeout(() => {
          if (detailSectionRef.current && window.innerWidth < 1024) {
            detailSectionRef.current.scrollIntoView({ behavior: "smooth", block: "start" });
          }
        }, 100);
      };

      const handleJoinToggle = (dateStr) => {
        if (!isNameSaved) {
          alert("先にマイページでプロフィール（名前と学年）を保存してください！");
          setCurrentView("mypage");
          return;
        }
        setEvents(prev => {
          const ev = prev[dateStr];
          if (!ev) return prev;
          const exists = ev.attendees.some(a => a.name === myName);
          let newAttendees;
          if (exists) {
            newAttendees = ev.attendees.filter(a => a.name !== myName);
          } else {
            if (ev.attendees.length >= ev.limit) {
              alert("定員に達しています！");
              return prev;
            }
            newAttendees = [...ev.attendees, { name: myName, grade: myGrade }];
          }
          return {
            ...prev,
            [dateStr]: { ...ev, attendees: newAttendees }
          };
        });
      };

      const handleAdminLogin = (e) => {
        e.preventDefault();
        if (inputPassword === "doronko15") {
          setIsAdmin(true);
          setAdminError(false);
        } else {
          setAdminError(true);
        }
      };

      const handleCreateEvent = (e) => {
        e.preventDefault();
        if (!newTitle) return;
        setEvents(prev => ({
          ...prev,
          [newDate]: {
            id: Date.now(),
            title: newTitle,
            location: newLocation,
            color: "bg-indigo-100 text-indigo-700 border-indigo-200",
            limit: Number(newLimit),
            startTime: newStartTime,
            endTime: newEndTime,
            items: newItems,
            description: newDesc,
            attendees: [],
            lineGroupUrl: ""
          }
        }));
        alert("新しい活動を登録しました！カレンダーに戻って確認してください。");
        setSelectedDate(newDate);
        setCurrentView("calendar");
      };

      const daysInMonth = Array.from({ length: 30 }, (_, i) => i + 1);
      const activeEvent = selectedDate ? events[selectedDate] : null;

      return (
        <div className="min-h-screen bg-slate-50 text-slate-800 p-3 sm:p-5 font-sans">
          {/* ヘッダー */}
          <header className="max-w-6xl mx-auto mb-4 sm:mb-6">
            <div className="flex flex-col sm:flex-row justify-between items-center bg-white p-3.5 sm:p-5 rounded-2xl border border-slate-200 shadow-sm gap-3">
              <h1 className="text-xl sm:text-2xl font-black text-amber-800 tracking-tight flex items-center gap-2">
                🌱 どろんこ 活動カレンダー
              </h1>
              <div className="flex w-full sm:w-auto bg-slate-100 p-1 rounded-xl border border-slate-200">
                <button
                  onClick={() => setCurrentView("calendar")}
                  className={`flex-1 sm:flex-none px-4 py-2 text-xs font-bold rounded-lg transition-all ${
                    currentView === "calendar" ? "bg-white text-amber-800 shadow-sm" : "text-slate-500"
                  }`}
                >
                  📅 カレンダー
                </button>
                <button
                  onClick={() => setCurrentView("mypage")}
                  className={`flex-1 sm:flex-none px-4 py-2 text-xs font-bold rounded-lg transition-all ${
                    currentView === "mypage" ? "bg-white text-amber-800 shadow-sm" : "text-slate-500"
                  }`}
                >
                  👤 マイページ ＆ 館付
                </button>
              </div>
            </div>
          </header>

          <main className="max-w-6xl mx-auto">
            {currentView === "calendar" ? (
              <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                {/* カレンダー本体 */}
                <div className="lg:col-span-2 space-y-4">
                  <div className="bg-white rounded-2xl p-4 sm:p-6 border border-slate-200 shadow-sm">
                    <div className="flex justify-between items-center mb-4">
                      <h2 className="text-lg sm:text-xl font-bold text-amber-700 font-mono">2026年 11月</h2>
                      <span className="text-xs bg-amber-50 text-amber-700 px-3 py-1 rounded-full font-bold border border-amber-200">
                        ログイン中: {myName} ({myGrade})
                      </span>
                    </div>
                    <div className="grid grid-cols-7 gap-1 sm:gap-2 text-center text-xs font-bold text-slate-400 mb-2">
                      <div className="text-rose-500">日</div><div>月</div><div>火</div><div>水</div><div>木</div><div>金</div><div className="text-sky-500">土</div>
                    </div>
                    <div className="grid grid-cols-7 gap-1 sm:gap-2">
                      {daysInMonth.map((day) => {
                        const dateStr = `2026-11-${String(day).padStart(2, "0")}`;
                        const hasEvent = events[dateStr];
                        const isSelected = selectedDate === dateStr;

                        return (
                          <div
                            key={day}
                            onClick={() => handleDateClick(dateStr)}
                            className={`h-16 sm:h-20 border rounded-xl p-1.5 cursor-pointer transition-all flex flex-col justify-between active:scale-95 ${
                              isSelected 
                                ? "border-amber-500 bg-amber-50/60 ring-2 ring-amber-500/20" 
                                : hasEvent 
                                  ? "border-slate-300 bg-slate-50 hover:border-amber-400" 
                                  : "border-slate-100 bg-white"
                            }`}
                          >
                            <span className="text-[10px] sm:text-xs font-bold font-mono text-slate-400">{day}</span>
                            {hasEvent && (
                              <div className="w-full">
                                <div className={`text-[8px] sm:text-[9px] px-1 py-0.5 rounded truncate font-bold border ${hasEvent.color}`}>
                                  {hasEvent.location}
                                </div>
                                <div className="text-[8px] sm:text-[9px] text-right font-bold text-amber-700 font-mono mt-0.5">
                                  {hasEvent.attendees.length}/{hasEvent.limit}人
                                </div>
                              </div>
                            )}
                          </div>
                        );
                      })}
                    </div>
                  </div>
                </div>

                {/* 詳細・参加パネル */}
                <div ref={detailSectionRef} className="bg-white rounded-2xl p-4 sm:p-6 border border-slate-200 shadow-sm h-fit scroll-mt-4">
                  {selectedDate && activeEvent ? (
                    <div>
                      <div className="border-b border-slate-200 pb-3 mb-4">
                        <span className="text-xs text-slate-400 font-mono">{selectedDate}</span>
                        <h3 className="text-base sm:text-lg font-black text-slate-800 mt-0.5">{activeEvent.title}</h3>
                        <div className="flex flex-wrap gap-2 mt-1.5">
                          <span className="text-xs text-amber-700 font-bold bg-amber-50 px-2 py-0.5 rounded border border-amber-200">📍 拠点: {activeEvent.location}</span>
                          <span className="text-xs text-slate-600 font-mono bg-slate-100 px-2 py-0.5 rounded">⏰ {activeEvent.startTime}〜{activeEvent.endTime}</span>
                        </div>
                      </div>

                      <div className="space-y-2 mb-4 text-xs bg-slate-50 p-3 rounded-xl border border-slate-200">
                        <div><span className="font-bold text-slate-500">🎒 持ち物:</span> {activeEvent.items}</div>
                        <div><span className="font-bold text-slate-500">📝 内容:</span> {activeEvent.description}</div>
                      </div>

                      <div className="mb-4">
                        <div className="flex justify-between items-center text-xs text-slate-500 font-medium mb-1">
                          <span>参加メンバー ({activeEvent.attendees.length}/{activeEvent.limit}人)</span>
                        </div>
                        <div className="w-full bg-slate-100 rounded-full h-2.5 overflow-hidden border border-slate-200 mb-2">
                          <div className="bg-gradient-to-r from-amber-500 to-emerald-500 h-2.5 rounded-full transition-all" style={{ width: `${(activeEvent.attendees.length / activeEvent.limit) * 100}%` }}></div>
                        </div>
                        <div className="flex flex-wrap gap-1.5 max-h-24 overflow-y-auto p-1 bg-slate-50 rounded-xl border border-slate-100">
                          {activeEvent.attendees.length === 0 ? (
                            <span className="text-xs text-slate-400 p-1">まだ参加者はいません</span>
                          ) : (
                            activeEvent.attendees.map((att, idx) => (
                              <span key={idx} className={`text-xs px-2 py-0.5 rounded-lg border font-bold ${gradeColors[att.grade] || "bg-slate-100"}`}>
                                {att.name} ({att.grade})
                              </span>
                            ))
                          )}
                        </div>
                      </div>

                      <button
                        onClick={() => handleJoinToggle(selectedDate)}
                        className={`w-full py-3 rounded-xl font-bold text-sm shadow-sm transition-all ${
                          activeEvent.attendees.some(a => a.name === myName)
                            ? "bg-rose-50 text-rose-600 border border-rose-200 hover:bg-rose-100"
                            : "bg-amber-600 text-white hover:bg-amber-700"
                        }`}
                      >
                        {activeEvent.attendees.some(a => a.name === myName) ? "参加をキャンセルする" : "この活動に参加する！"}
                      </button>
                    </div>
                  ) : (
                    <div className="text-center py-10 text-slate-400 text-xs font-medium">
                      カレンダーの日付をタップすると、詳細や参加ボタンが表示されます。
                    </div>
                  )}
                </div>
              </div>
            ) : (
              /* マイページ ＆ 館付 画面 */
              <div className="max-w-2xl mx-auto space-y-6">
                <div className="bg-white rounded-2xl p-6 border border-slate-200 shadow-sm space-y-4">
                  <h3 className="text-lg font-black text-slate-800 flex items-center gap-2">👤 プロフィール設定（なりすまし防止）</h3>
                  <p className="text-xs text-slate-500">ここで名前と学年を設定すると、カレンダーの参加ボタンでこの名前が使われます。</p>
                  
                  <div className="space-y-3">
                    <div>
                      <label className="block text-xs font-bold text-slate-600 mb-1">お名前（ニックネーム可）</label>
                      <input
                        type="text"
                        value={myName}
                        onChange={(e) => setMyName(e.target.value)}
                        className="w-full px-3 py-2 border border-slate-300 rounded-xl text-sm focus:outline-none focus:border-amber-500"
                        placeholder="例: どろね"
                      />
                    </div>
                    <div>
                      <label className="block text-xs font-bold text-slate-600 mb-1">学年カラー</label>
                      <div className="grid grid-cols-4 gap-2">
                        {["1年", "2年", "3年", "4年"].map((grade) => (
                          <button
                            key={grade}
                            type="button"
                            onClick={() => setMyGrade(grade)}
                            className={`py-2 rounded-xl text-xs font-bold border transition-all ${
                              myGrade === grade ? "border-amber-600 bg-amber-50 text-amber-800 ring-2 ring-amber-500/20" : "border-slate-200 text-slate-600 bg-white"
                            }`}
                          >
                            {grade} ({grade === "1年" ? "黄緑" : grade === "2年" ? "黄色" : grade === "3年" ? "紫" : "ピンク"})
                          </button>
                        ))}
                      </div>
                    </div>
                    <button
                      onClick={() => { setIsNameSaved(true); alert("プロフィールを保存しました！"); }}
                      className="w-full bg-slate-800 text-white font-bold py-2.5 rounded-xl text-xs hover:bg-slate-900 transition-all"
                    >
                      プロフィールを固定する
                    </button>
                  </div>
                </div>

                {/* 館付（リーダー）認証 & 登録フォーム */}
                <div className="bg-white rounded-2xl p-6 border border-slate-200 shadow-sm space-y-4">
                  <h3 className="text-lg font-black text-slate-800 flex items-center gap-2">🔑 館付（リーダー）専用メニュー</h3>
                  
                  {!isAdmin ? (
                    <form onSubmit={handleAdminLogin} className="space-y-3">
                      <p className="text-xs text-slate-500">活動の新規登録を行うには、館付パスワードを入力してください。（テスト用: <code className="bg-slate-100 px-1.5 py-0.5 rounded text-amber-700 font-mono">doronko15</code>）</p>
                      <div className="flex gap-2">
                        <input
                          type="password"
                          value={inputPassword}
                          onChange={(e) => setInputPassword(e.target.value)}
                          placeholder="パスワードを入力"
                          className="flex-1 px-3 py-2 border border-slate-300 rounded-xl text-sm focus:outline-none focus:border-amber-500"
                        />
                        <button type="submit" className="bg-amber-600 text-white px-4 py-2 rounded-xl text-xs font-bold hover:bg-amber-700">
                          認証
                        </button>
                      </div>
                      {adminError && <p className="text-xs text-rose-500 font-bold">パスワードが違います</p>}
                    </form>
                  ) : (
                    <form onSubmit={handleCreateEvent} className="space-y-4 border-t border-slate-100 pt-4">
                      <div className="bg-emerald-50 text-emerald-800 text-xs p-3 rounded-xl border border-emerald-200 font-bold">
                        ✅ 館付権限でログイン中：新しい活動を登録できます
                      </div>
                      <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                        <div>
                          <label className="block text-xs font-bold text-slate-600 mb-1">活動タイトル</label>
                          <input type="text" value={newTitle} onChange={e => setNewTitle(e.target.value)} placeholder="例: 神明あそび相手" required className="w-full px-3 py-2 border border-slate-300 rounded-xl text-xs" />
                        </div>
                        <div>
                          <label className="block text-xs font-bold text-slate-600 mb-1">活動先拠点</label>
                          <select value={newLocation} onChange={e => setNewLocation(e.target.value)} className="w-full px-3 py-2 border border-slate-300 rounded-xl text-xs bg-white">
                            {locationsList.map(loc => <option key={loc} value={loc}>{loc}</option>)}
                          </select>
                        </div>
                        <div>
                          <label className="block text-xs font-bold text-slate-600 mb-1">日付</label>
                          <input type="date" value={newDate} onChange={e => setNewDate(e.target.value)} className="w-full px-3 py-2 border border-slate-300 rounded-xl text-xs" />
                        </div>
                        <div>
                          <label className="block text-xs font-bold text-slate-600 mb-1">定員 (人)</label>
                          <input type="number" value={newLimit} onChange={e => setNewLimit(e.target.value)} className="w-full px-3 py-2 border border-slate-300 rounded-xl text-xs" />
                        </div>
                      </div>
                      <button type="submit" className="w-full bg-emerald-600 text-white font-bold py-3 rounded-xl text-xs hover:bg-emerald-700 transition-all">
                        ✨ この内容で活動を登録する
                      </button>
                    </form>
                  )}
                </div>
              </div>
            )}
          </main>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
